name: BETQ production feed probe

# Branch-only replacement of the registered manual workflow path. Never merge.
# Fresh attempt approved after run 69 stopped before the provider request.
# Only reviewed run 70 may proceed; this does not authorize an automatic dispatch.
on:
  workflow_dispatch:
    inputs:
      approve_one_request:
        description: Approve one Odds API NFL h2h US GET, at most one expected quota credit, no retries
        type: boolean
        default: false
        required: true
      repository_secret_confirmed:
        description: Confirm the reviewed existing repository secret belongs to the intended Odds API account
        type: boolean
        default: false
        required: true
      expected_sha:
        description: Full reviewed commit SHA for this isolated branch
        type: string
        required: true
      expires_at:
        description: Approval expiry in canonical UTC, at most 15 minutes ahead
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: betq-one-shot-odds-diagnostic-20261108
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.repository == 'SpencerPhoenix/BETQ-ai' &&
      github.actor == 'SpencerPhoenix' && github.triggering_actor == 'SpencerPhoenix' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/one-shot-odds-diagnostic-20261108' &&
      github.run_number == 70 && github.run_attempt == 1 &&
      inputs.approve_one_request && inputs.repository_secret_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ODDS_APPROVED: ${{ inputs.approve_one_request }}
      ODDS_SECRET_CONFIRMED: ${{ inputs.repository_secret_confirmed }}
      ODDS_EXPECTED_SHA: ${{ inputs.expected_sha }}
      ODDS_EXPIRES_AT: ${{ inputs.expires_at }}
    steps:
      - name: Check out exact dispatched revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node without installing application dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify unchanged main and fail closed until preparation is complete
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$MAIN_SHA" == '69ca969eeef474b379a0b8bc729a1cdde348dc6e' ]]
          ODDS_CURRENT_MAIN_SHA="$MAIN_SHA" node scripts/one-shot-odds/verify.mjs
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify offline diagnostic regressions and unchanged application
        run: |
          node --check scripts/one-shot-odds/run.mjs
          node --check scripts/one-shot-odds/verify.mjs
          npm run check
          npm test
          git diff --exit-code
      - name: Recheck main immediately before the one approved request
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$MAIN_SHA" == '69ca969eeef474b379a0b8bc729a1cdde348dc6e' ]]
          ODDS_CURRENT_MAIN_SHA="$MAIN_SHA" node scripts/one-shot-odds/verify.mjs
      - name: Make one isolated request and print only sanitized status and quota
        env:
          # Existing repository secret, exposed only to the final one-request step.
          ODDS_ONE_SHOT_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_CURRENT_MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        run: node scripts/one-shot-odds/run.mjs
