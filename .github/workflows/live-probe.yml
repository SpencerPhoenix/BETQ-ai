name: BETQ production feed probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public health and live odds safely
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://betq-ai.onrender.com';
          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          async function read(path, allowPaid = false) {
            const res = await fetch(base + path, {
              headers: { Accept: 'application/json', ...(allowPaid ? { 'x-betq-paid-request': 'true' } : {}) },
              signal: AbortSignal.timeout(95000)
            });
            const raw = await res.text();
            let body = null;
            try { body = JSON.parse(raw); } catch { /* handled by validation */ }
            return { status: res.status, body };
          }
          let health;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              health = await read('/api/health');
              if (health.status === 200 && health.body?.status === 'ok') break;
            } catch (error) {
              console.log('Health attempt ' + attempt + ': transient connection issue');
            }
            if (attempt < 3) await wait(10000);
          }
          if (health?.status !== 200 || health?.body?.status !== 'ok') {
            console.error('PRODUCTION HEALTH: FAIL');
            process.exit(1);
          }
          console.log('PRODUCTION HEALTH: OK');
          console.log('Version: ' + String(health.body.version || 'unknown'));
          const configured = health.body.odds?.configured === true;
          console.log('ODDS_API_KEY configured on server: ' + (configured ? 'YES' : 'NO'));
          if (!configured) {
            console.log('LIVE DATA: NOT READY (set ODDS_API_KEY in Render; demo still operates)');
            process.exit(0);
          }
          // Request one live NFL moneyline snapshot. This may cost one provider credit.
          let result;
          try { result = await read('/api/slate?sport=americanfootball_nfl&market=h2h&mode=live', true); }
          catch {
            console.error('LIVE DATA: network error');
            process.exit(1);
          }
          if (result.status !== 200 || result.body?.source !== 'THE_ODDS_API_V4' || result.body?.demo !== false) {
            console.error('LIVE DATA: FAIL, HTTP=' + result.status + ', code=' + String(result.body?.error?.code || 'UNKNOWN'));
            process.exit(1);
          }
          console.log('LIVE DATA: VERIFIED');
          console.log('Sport: ' + result.body.sport + ' / market: ' + result.body.market);
          console.log('Games: ' + Number(result.body.summary?.games ?? 0));
          console.log('Signals: ' + Number(result.body.summary?.signals ?? 0));
          console.log('Model independently validated: ' + String(result.body.independentlyValidated === true));
          console.log('Provider credits remaining: ' + String(result.body.quota?.remaining ?? 'not reported'));
          NODE
