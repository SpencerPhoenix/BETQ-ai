name: BETQ scheduled model-only evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: betq-model-only-scheduled-publication
  cancel-in-progress: false

jobs:
  model-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BETQ_MODEL_ONLY_RELEASE_SHA: ${{ vars.BETQ_MODEL_ONLY_RELEASE_SHA }}
    steps:
      - name: Require immutable release before checkout
        shell: bash
        run: |
          if [[ ! "$BETQ_MODEL_ONLY_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::BETQ_MODEL_ONLY_RELEASE_SHA must pin one exact verified release"
            exit 1
          fi
      - name: Initialize runner-local ledger path
        run: echo "LEDGER_PATH=$RUNNER_TEMP/betq-model-only/ledger.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BETQ_MODEL_ONLY_RELEASE_SHA }}
          persist-credentials: false
      - name: Confirm bound checkout and release-control version
        id: release-control
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BETQ_MODEL_ONLY_RELEASE_SHA"
          # An earlier release lacks fail-closed verification and is not admissible.
          grep -Fq 'const expectedRelease=boundSha' scripts/run-model-only-cycle.mjs
          if grep -Fq "mode==='settle'" scripts/run-model-only-cycle.mjs; then
            echo 'separate_settlement=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Fetch exact prior one-file evidence branch without publisher credentials
        run: node scripts/publish-model-only-ledger.mjs prepare "$LEDGER_PATH"
      - name: Reserve official fixtures before any model capture
        run: node scripts/run-model-only-cycle.mjs reserve "$LEDGER_PATH"
      - name: Publish reservations with fast-forward and exact byte readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-model-only-ledger.mjs reserve "$LEDGER_PATH"
      - name: Capture only this run attempt's durably reserved fixtures without credentials
        run: node scripts/run-model-only-cycle.mjs capture "$LEDGER_PATH"
      - name: Publish captures then persist separately verified custody acknowledgments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-model-only-ledger.mjs final "$LEDGER_PATH"
      - name: Check final scores only after durable forecast custody
        if: steps.release-control.outputs.separate_settlement == 'true'
        run: node scripts/run-model-only-cycle.mjs settle "$LEDGER_PATH"
      - name: Publish settlement observations without modifying forecast custody
        if: steps.release-control.outputs.separate_settlement == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-model-only-ledger.mjs settle "$LEDGER_PATH"
      - name: Report forecast capture and postgame grading separately
        run: node scripts/report-model-only-run.mjs "$LEDGER_PATH"
      - name: Preserve candidates and publication checkpoint for explicit operator recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-only-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/betq-model-only/
          retention-days: 30
          if-no-files-found: warn
