name: Apply and verify audited reliability repair
on:
  push:
    branches: ['audit/reliability-2026-11-02']
    paths: ['.github/workflows/apply-audit-patch.yml', '.audit-input/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-audit-import
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/audit/reliability-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode bounded transport and verify original local patch checksum
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          root=pathlib.Path('.audit-input')
          chunks=[(root/f'part{i}.b64').read_text().strip() for i in range(1,5)]
          # Normalize two identified transcription duplications in transport;
          # the complete original SHA-256 still MUST match before any patch applies.
          s=''.join(chunks).replace('5135SSKJh9','5135SSJh9').replace('svvnpRnpR9','svvnpR9')
          raw=gzip.decompress(base64.b64decode(s,validate=True))
          expected='fef27476c53b7c21a2a3a282840e1528efa8d64a76dec32eb6e2b26812ae15c6'
          actual=hashlib.sha256(raw).hexdigest()
          print('Verified local patch checksum:',actual)
          if actual!=expected or len(raw)!=75574:raise SystemExit('PATCH_CHECKSUM_MISMATCH')
          path=pathlib.Path('/tmp/audited-repair.patch');path.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Full syntax, regression and stress tests
        run: |
          mkdir -p audit-output
          npm run check | tee audit-output/syntax.log
          npm test | tee audit-output/tests.log
      - name: Commit tested source to isolated branch, never main
        run: |
          git config user.name 'betq-audit-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add src public scripts tests docs package.json
          git rm -r .audit-input
          git commit -m 'fix: audited reliability boundaries, stress regressions and calibrated evidence gates'
          git push origin HEAD:audit/reliability-2026-11-02
      - name: Independent week-block sensitivity on public historical data (no paid odds)
        run: |
          node scripts/train-efficiency.mjs | tee audit-output/week-sensitivity-training.log
          cp data/nfl_efficiency.json audit-output/efficiency-evaluation.json
      - name: Export exact audited source and results
        if: always()
        run: |
          git rev-parse HEAD > audit-output/source-commit.txt
          tar -czf audit-output/source-snapshot.tar.gz src tests public scripts data docs .github package.json README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betq-verified-reliability-release
          path: audit-output/
          retention-days: 7
