name: BETQ quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Reproducible locked dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source syntax
        run: npm run check
      - name: Offline unit and HTTP tests
        run: npm test
      - name: Smoke test server and demo API
        shell: bash
        run: |
          node src/server.mjs > /tmp/betq-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS 'http://127.0.0.1:3000/api/slate?mode=demo' > /tmp/demo.json
          node -e "const d=require('/tmp/demo.json'); if(!d.demo || d.summary.games!==3) process.exit(1)"
  offline-browser:
    name: Offline browser release QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproducible application dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser test tooling
        run: |
          python -m venv .browser-venv
          .browser-venv/bin/python -m pip install playwright==1.62.0
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Run intercepted offline desktop and mobile checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p browser-output
          git rev-parse HEAD > browser-output/source-commit.txt
          status=0
          for script in ui-audit-browser game-strategies-browser retained-forecasts-browser release-browser official-injury-browser; do
            .browser-venv/bin/python "tests/${script}.py" "browser-output/${script}" 2>&1 | tee "browser-output/${script}.log" || status=1
          done
          exit "$status"
      - name: Preserve browser screenshots, reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betq-offline-browser-${{ github.run_id }}
          path: browser-output/
          retention-days: 14
          if-no-files-found: warn
