name: BETQ free production reliability audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public runtime and research metadata without spending odds credits
        run: |
          node --input-type=module <<'NODE'
          const base='https://betq-ai.onrender.com';
          async function read(path){
            const r=await fetch(base+path,{signal:AbortSignal.timeout(95000)});
            if(!r.ok)throw Error(path+' HTTP '+r.status);
            return r.json();
          }
          const health=await read('/api/health');
          if(!/^0\.4\./.test(health.version))throw Error('Incompatible runtime');
          const config=await read('/api/config');
          if(config.wageringEnabled!==false||config.autoRefresh!==false)throw Error('Unsafe execution/polling');
          const e=await read('/api/model/efficiency');
          if(e.automaticallyPromoted!==false||e.verifiedRealMoneyEdge!==false)throw Error('Unsupported predictive claim');
          const injuries=await read('/api/injuries/nfl');
          if(injuries.starterVerified!==false||injuries.modelProbabilitiesAdjusted!==false)throw Error('Unverified starter claim');
          const evidence=await read('/api/evidence/nfl');
          if(evidence.realizedROI!==null||evidence.verifiedCLV!==null)throw Error('Unverified ROI/CLV claim');
          const demo=await read('/api/slate?mode=demo&sport=americanfootball_nfl&market=h2h');
          if(!demo.demo||demo.events.some(g=>g.efficiencyChallenger||g.injuryContext))throw Error('Demo/live mixing');
          console.log(JSON.stringify({version:health.version,researchOnly:true,paidOddsRequests:0,evidenceGames:evidence.prospectiveGames,forwardFinals:evidence.settledGames,status:'PASS'},null,2));
          NODE
