name: BETQ v0.4 live intelligence audit
on:
  push:
    paths: ['.github/workflows/phase4-production-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live research provenance, model separation and injury-report status
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://betq-ai.onrender.com';
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function read(path){
            const res=await fetch(base+path,{headers:{Accept:'application/json'},
              signal:AbortSignal.timeout(95000)});
            const text=await res.text();
            let body=null;try{body=JSON.parse(text)}catch{}
            return {code:res.status,body,text};
          }
          let health=null;
          for(let i=0;i<6;i++){
            try {
              const response=await read('/api/health');
              if(response.code===200&&response.body?.version==='0.4.0'){
                health=response.body;break;
              }
            }catch{}
            await wait(10000);
          }
          if(!health)throw Error('Production server v0.4 unavailable');
          if(!health.nflIntelligence?.efficiencyChallengerAvailable)
            throw Error('EPA research artifact missing');
          if(!health.nflIntelligence?.injurySourceAvailable)
            throw Error('Sourced injury report artifact missing');
          if(health.nflIntelligence?.efficiencyChallengerPromoted!==false||
             health.nflIntelligence?.startingQuarterbacksVerified!==false)
            throw Error('Unsupported auto-promotion or QB verification claim');
          const efficiency=await read('/api/model/efficiency');
          if(efficiency.code!==200||efficiency.body?.available!==true||
             efficiency.body.automaticallyPromoted!==false||
             efficiency.body.verifiedRealMoneyEdge!==false||
             efficiency.body.holdout?.challenger?.n<230||
             efficiency.body.sourceManifest?.project!=='nflverse/nflverse-data')
            throw Error('Efficiency source/version/model audit failed');
          const injuries=await read('/api/injuries/nfl');
          if(injuries.code!==200||injuries.body.starterVerified!==false||
             injuries.body.modelProbabilitiesAdjusted!==false)
            throw Error('Injury source provenance / safety gate failed');
          const page=await fetch(base+'/',{signal:AbortSignal.timeout(30000)});
          const html=await page.text();
          if(page.status!==200||!html.includes('id="intelligence-view"'))
            throw Error('Prediction Lab intelligence UI missing');
          const demo=await read('/api/slate?mode=demo&sport=americanfootball_nfl&market=h2h');
          if(demo.code!==200||!demo.body.demo||demo.body.events.some(e=>e.efficiencyChallenger||e.injuryContext))
            throw Error('Synthetic demo contains real-team intelligence');
          console.log('PRODUCTION: v'+health.version+' LIVE');
          console.log('2025 Elo Brier: '+efficiency.body.holdout.elo.brier);
          console.log('2025 EPA challenger Brier: '+efficiency.body.holdout.challenger.brier);
          console.log('Historical holdout gate passed: '+efficiency.body.promotableInHistoricalHoldout);
          console.log('Automatically promoted: '+efficiency.body.automaticallyPromoted);
          console.log('Injury source vintage: '+injuries.body.sourceUpdatedAt);
          console.log('Per-player timestamps available: '+injuries.body.playerTimestampAvailable);
          console.log('Confirmed starting QB status: '+injuries.body.starterVerified);
          // Avoid consuming a paid API credit if a snapshot is already unavailable
          // under the intentionally strict daily provider budget.
          const budget=health.odds?.budget;
          if((budget?.available??0)<=0){
            console.log('LIVE NFL SLATE: skipped; daily provider budget exhausted');
          } else {
            const live=await read('/api/slate?mode=live&sport=americanfootball_nfl&market=h2h');
            if(live.code===429){
              console.log('LIVE NFL SLATE: safeguarded by daily budget / reserved credits');
            } else if(live.code!==200){
              throw Error('Live odds endpoint HTTP '+live.code+' '+String(live.body?.error?.code));
            } else {
              const games=live.body.events||[];
              const future=games.filter(e=>!e.started&&e.independentModel?.available);
              if(future.length>0&&future.some(e=>!e.efficiencyChallenger||!e.injuryContext))
                throw Error('Live NFL game missing source-aligned research fields');
              if(future.some(e=>e.efficiencyChallenger?.automaticSelection===true||
                 e.injuryContext?.starterVerified===true))
                throw Error('Unsupported research promotion or starter claim');
              console.log('LIVE NFL modeled upcoming games: '+future.length);
            }
          }
          console.log('PHASE 4: PASS — source-backed, source-vintage-gated, no wagering');
          NODE
