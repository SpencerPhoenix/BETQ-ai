name: BETQ lock optional private PostgreSQL adapter dependencies
on:
  # Code publication must not run research or publish generated artifacts.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate dependency lock without lifecycle scripts or Odds API keys
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible installation and complete offline test suite
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Commit independently verified lockfile
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            git config user.name 'betq-dependency-audit-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock node-postgres and transitive packages for reproducible shadow archival'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          else
            echo 'Lockfile already in sync.'
          fi
