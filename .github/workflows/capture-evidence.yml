name: BETQ prospective NFL evidence collector
on:
  push:
    branches: [main]
    paths: ['scripts/capture-evidence.mjs', 'src/evidence.mjs']
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * *'
    - cron: '15 16 * * 0'
    - cron: '15 17 * * 0'
    - cron: '15 21 * * 0'
    - cron: '15 22 * * 0'
    - cron: '35 0 * * 1'
    - cron: '35 1 * * 1'
permissions:
  contents: write
concurrency:
  # Shared writer lock with settlement-only.yml; prevents overlapping JSON updates.
  # GitHub may replace a pending run, so no-cost daily reconciliation still retries.
  group: betq-evidence-journal-writers
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true # required for guarded evidence-only push
      - name: Start from latest origin/main after entering writer queue
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate quant and evidence boundaries
        run: |
          npm run check
          npm test
      - name: Check compatible production runtime before requesting paid odds
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --max-time 45 -fsS https://betq-ai.onrender.com/api/health |
              node scripts/verify-evidence-health.mjs; then
              exit 0
            fi
            sleep 12
          done
          echo 'Compatible production unavailable; no paid odds requested.' >&2
          exit 1
      - name: Capture only genuine pregame observations and reconcile results
        run: node scripts/capture-evidence.mjs
      - name: Verify immutable journal and no raw odds/secrets
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          import {validateJournal,summarizeEvidence} from './src/evidence.mjs';
          const files=(await readdir('data/evidence')).filter(x=>/^nfl-\d{4}\.json$/.test(x));
          for(const name of files){
            const j=validateJournal(JSON.parse(await readFile('data/evidence/'+name,'utf8')));
            const text=JSON.stringify(j);
            if(/americanOdds|decimalOdds|bookmakerKey|bookmakers|API_KEY|apiKey/.test(text))throw Error('Raw odds or secret in journal');
            if(j.snapshots.some(s=>s.researchOnly!==true))throw Error('Nonresearch forecast');
            const r=summarizeEvidence(j);
            if(r.forwardMetrics&&r.settledGames<30)throw Error('Premature performance claim');
            if(r.challengerForwardComparison&&r.pairedChallengerSettled<30)throw Error('Premature challenger claim');
            console.log('PASS',name,'prospective games',r.prospectiveGames,'finalized',r.settledGames);
          }
          NODE
      - name: Publish new derived evidence without overwriting forecasts
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/evidence/)" ]]; then
            git config user.name 'betq-evidence-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add data/evidence/
            git commit -m 'data: append prospective evidence and reconcile final scores [skip render]'
            # The shared writer queue prevents bot-vs-bot conflict.
            # Concurrent external main edits must fail closed, NOT rebase
            # previously observed, immutable capture timestamps over fresh data.
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo 'Main changed outside the writer queue; preserve candidate artifact for manual merge.' >&2
              exit 1
            fi
            git push origin HEAD:main || {
              echo 'Fast-forward evidence push rejected; candidate artifact retained for review.' >&2
              exit 1
            }
      - name: Preserve public-derived candidate if publication fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: betq-unpublished-capture-${{ github.run_id }}
          path: |
            data/evidence/nfl-2026.json
            data/evidence/summary.json
          retention-days: 30
          if-no-files-found: warn
