name: BETQ free-only NFL settlement reconciliation
on:
  pull_request:
    paths:
      - 'src/settlement-only.mjs'
      - 'scripts/reconcile-settlements.mjs'
      - 'tests/settlement-only.test.mjs'
      - 'src/settlement-corroboration.mjs'
      - 'tests/settlement-corroboration.test.mjs'
      - 'src/evidence.mjs'
      - 'scripts/capture-evidence.mjs'
      - 'src/evidence-transition.mjs'
      - 'scripts/verify-evidence-append-only.mjs'
      - 'tests/evidence-transition.test.mjs'
      - '.github/workflows/settlement-only.yml'
      - 'src/settlement-candidate.mjs'
      - 'scripts/settlement-candidate.mjs'
      - 'tests/settlement-candidate.test.mjs'
      - 'package.json'
  workflow_dispatch:
    inputs:
      operation:
        description: Validate offline, or explicitly prepare a review-only candidate
        type: choice
        options: [validate, prepare]
        default: validate
        required: true
      expected_main_sha:
        description: Full reviewed main commit SHA; required only for preparation
        type: string
        default: ''
        required: false
      source_use_confirmed:
        description: I have authorization for the intended source use and this preparation
        type: boolean
        default: false
        required: false
# No schedule and no publisher. Merge or ordinary dispatch cannot publish outcomes.
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline syntax and regression tests (mocked sources)
        run: |
          npm run check
          npm test
  preparation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_main_sha }}
      SETTLEMENT_OPERATION: ${{ inputs.operation }}
      SOURCE_USE_CONFIRMED: ${{ inputs.source_use_confirmed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit source-use approval and exact current main revision
        shell: bash
        run: |
          export CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          node scripts/settlement-candidate.mjs preflight
      - name: Retest the actual pinned preparation checkout
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Recheck revision before explicitly approved source requests
        shell: bash
        run: |
          export CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          node scripts/settlement-candidate.mjs preflight
      - name: Prepare derived candidate in runner-local files only
        env:
          ODDS_API_KEY: ''
        run: npm run evidence:settle
      - name: Verify unchanged forecasts and append-only result revisions
        run: node scripts/verify-evidence-append-only.mjs --settlement-only
      - name: Package review-only candidate bound to the exact baseline
        shell: bash
        run: |
          export CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          mkdir -p audit-output
          node scripts/settlement-candidate.mjs prepare > audit-output/settlement-candidate-report.json
          echo '## Preparation only; no publication authorized or performed' >> "$GITHUB_STEP_SUMMARY"
          cat audit-output/settlement-candidate-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the explicitly approved derived candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: betq-prepared-settlement-${{ github.run_id }}
          path: |
            audit-output/settlement-candidate.json
            audit-output/settlement-candidate-report.json
          retention-days: 30
          if-no-files-found: error
