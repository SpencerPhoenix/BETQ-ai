name: NFL injury report provenance refresh
on:
  # Code publication must not run research or publish generated artifacts.
  workflow_dispatch:
  schedule:
    - cron: '24 10 * * *'
permissions:
  contents: write
concurrency:
  group: betq-injury-report-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test source timestamp controls
        run: |
          npm run check
          npm test
      - name: Compile weekly public reports
        run: node scripts/update-injuries.mjs
      - name: Assert no unsupported starter claim
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('data/nfl_injuries.json','utf8'));
          if(a.schema!==1||a.source!=='NFLVERSE_INJURIES'||!a.sourceUpdatedAt||a.reportCount<5)throw Error('Source unavailable');
          if(!a.advisory?.includes('not confirmed quarterback starter'))throw Error('Starter caveat missing');
          console.log('File vintage:',a.sourceUpdatedAt,'Reports:',a.reportCount);
          NODE
      - name: Publish source-vintage changes only
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/nfl_injuries.json)" ]]; then
            git config user.name 'betq-injury-report-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add data/nfl_injuries.json
            git commit -m 'data: refresh sourced injury designations without starter assumptions'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'No new source vintage.'
          fi
