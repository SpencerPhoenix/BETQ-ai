name: NFL EPA efficiency challenger backtest
on:
  push:
    paths:
      - '.github/workflows/train-efficiency.yml'
      - 'scripts/train-efficiency.mjs'
      - 'src/pbp.mjs'
      - 'src/nfl-efficiency.mjs'
  workflow_dispatch:
  schedule:
    # Weekly after the NFL Monday games and nflverse 09:00 UTC PBP refresh.
    - cron: '37 10 * * 2'
permissions:
  contents: write
concurrency:
  group: betq-efficiency-research-trainer
  cancel-in-progress: false
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lagged feature and adversarial model tests
        run: |
          npm run check
          npm test
      - name: Stream nflverse seasonal PBP into lagged game features and evaluate 2025 holdout
        run: node scripts/train-efficiency.mjs
      - name: Verify independently tested challenger and source provenance
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('data/nfl_efficiency.json','utf8'));
          if(m.version!=='nfl-efficiency-1'||m.sourceManifest?.project!=='nflverse/nflverse-data'||
             m.holdout?.challenger?.n<230||m.calibration?.n<400||m.tuning?.n<850||
             Object.keys(m.teamFeatures||{}).length<30)throw Error('Independent evaluation/integrity threshold not met');
          if(m.holdout.confidence95===null||typeof m.promotable!=='boolean')
            throw Error('Missing uncertainty gate');
          if(m.promotable&&!(m.holdout.confidence95.lower>0&&m.holdout.deltaBrier>0.002))
            throw Error('Unsafe model promotion status');
          console.log('Holdout baseline:',m.holdout.elo);
          console.log('Holdout challenger:',m.holdout.challenger);
          console.log('Paired Brier difference CI:',m.holdout.confidence95);
          console.log('Automatic production promotion: DISABLED');
          NODE
      - name: Publish derived research artifact if results changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/nfl_efficiency.json)" ]]; then
            git config user.name "betq-nfl-model-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/nfl_efficiency.json
            git commit -m "data: publish versioned lagged NFL efficiency challenger holdout"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Completed-game source unchanged; no artifact update."
          fi
