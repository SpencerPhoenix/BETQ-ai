name: NFL EPA efficiency challenger backtest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/train-efficiency.yml', 'scripts/train-efficiency.mjs', 'src/pbp.mjs', 'src/nfl-efficiency.mjs', 'src/statistical-audit.mjs']
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * 2'
permissions:
  contents: write
concurrency:
  group: betq-efficiency-research-trainer
  cancel-in-progress: false
jobs:
  fit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lagged feature and adversarial model tests
        run: |
          npm run check
          npm test
      - name: Train from public NFL data and evaluate historical reference season
        run: node scripts/train-efficiency.mjs
      - name: Verify source, sample and dependence-aware research gates
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('data/nfl_efficiency.json','utf8'));
          if(m.version!=='nfl-efficiency-1'||m.evaluationVersion!==2||m.sourceManifest?.project!=='nflverse/nflverse-data'||m.holdout?.challenger?.n<230||m.calibration?.n<400||m.tuning?.n<850||Object.keys(m.teamFeatures||{}).length<30)throw Error('Source/evaluation integrity threshold not met');
          if(typeof m.promotable!=='boolean'||!m.holdout.weekSensitivity)throw Error('Missing week sensitivity');
          if(m.promotable&&!(m.holdout.confidence95.lower>0&&m.holdout.deltaBrier>0.002&&m.holdout.weekSensitivity.available&&m.holdout.weekSensitivity.lower>0))throw Error('Unsafe research gate');
          console.log('Historical reference:',JSON.stringify(m.holdout));
          console.log('Automatic production promotion: DISABLED');
          NODE
      - name: Publish only changed derived research
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/nfl_efficiency.json)" ]]; then
            git config user.name 'betq-nfl-model-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add data/nfl_efficiency.json
            git commit -m 'data: publish dependence-audited NFL efficiency research'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'Derived data unchanged.'
          fi
