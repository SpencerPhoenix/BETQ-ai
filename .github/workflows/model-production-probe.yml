name: BETQ production model audit
on:
  # A code push must not implicitly spend provider credits.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BETQ_OPERATOR_REFRESH_TOKEN: ${{ secrets.BETQ_OPERATOR_REFRESH_TOKEN }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live deployment model provenance and quota gates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { operatorRequest } from './scripts/operator-auth.mjs';
          const base='https://betq-ai.onrender.com';
          const request=async (path,allowPaid=false)=>{
            const paid=allowPaid?operatorRequest(path):null;
            const r=await fetch(paid?.endpoint||base+path,paid?.options||{redirect:'error',headers:{Accept:'application/json'},
              signal:AbortSignal.timeout(95000)});
            const j=await r.json();
            if(!r.ok)throw Error(path+': HTTP '+r.status+' '+String(j.error?.code||''));
            return j;
          };
          const health=await request('/api/health');
          if(health.operatorRefresh?.authenticationRequired!==true||health.operatorRefresh?.paidIntentRequired!==true)
            throw Error('Backend operator authentication contract unavailable');
          if(health.nflModel?.available!==true)throw Error('NFL model artifact missing from production runtime');
          console.log('DEPLOYMENT VERSION: '+health.version);
          console.log('DAILY CREDIT LIMIT: '+health.odds.budget.limit);
          console.log('PROVIDER CREDITS LEFT: '+String(health.odds.quota?.remaining??'not reported'));
          const m=await request('/api/model/nfl');
          if(!m.available||m.source?.project!=='nflverse/nflverse-data'||m.holdout?.n<250||
             m.holdout?.brier>=0.25||m.readyForResearch!==true)
            throw Error('Model provenance/holdout quality gate failed');
          console.log('MODEL: '+m.modelVersion+' · '+m.source.project+' · trained through '+m.lastGameDate);
          console.log('HOLDOUT: '+m.holdout.n+' games · Brier '+m.holdout.brier+' · accuracy '+m.holdout.accuracy);
          const cfg=await request('/api/config');
          if(cfg.wageringEnabled!==false||cfg.autoRefresh!==false)
            throw Error('Unsafe execution or uncontrolled polling enabled');
          const demo=await request('/api/slate?mode=demo&sport=americanfootball_nfl&market=h2h');
          if(!demo.demo||!demo.events.length||demo.events.some(e=>e.independentModel))
            throw Error('Demo/live projections mixed');
          if (health.captureReadiness?.ready !== true) {
            console.log('LIVE CAPTURE SKIPPED: ' + String(health.captureReadiness?.reason || 'OPERATOR_BUDGET_NOT_READY'));
            process.exit(0);
          }
          if (!process.env.BETQ_OPERATOR_REFRESH_TOKEN?.trim()) {
            console.log('LIVE CAPTURE SKIPPED: OPERATOR_TOKEN_MISSING; public model checks only');
            process.exit(0);
          }
          const live=await request('/api/slate?mode=live&sport=americanfootball_nfl&market=h2h',true);
          if(live.demo!==false||live.source!=='THE_ODDS_API_V4')throw Error('Live odds source invalid');
          const pending=live.events.filter(e=>!e.started);
          const modeled=pending.filter(e=>e.independentModel?.available);
          if(pending.length>0&&modeled.length===0)
            throw Error('No real upcoming NFL games received model predictions');
          if(modeled.some(e=>e.independentModel.use!=='RESEARCH_ONLY'||
             e.opportunities.some(s=>s.eloStatus&&s.eloStatus!=='RESEARCH_ONLY')))
            throw Error('Research projections mislabeled as executable');
          console.log('LIVE NFL GAMES: '+live.summary.games+' · priced signals '+live.summary.signals);
          console.log('ELIGIBLE UPCOMING: '+pending.length+' · independently modeled '+modeled.length);
          console.log('RESULT: PASS — authenticated live snapshot, model source valid, guarded, research-only');
          NODE
