name: NFL historical model research refresh
on:
  push:
    branches: [main]
    paths: ['scripts/train-nfl.mjs', 'src/nfl-elo.mjs', '.github/workflows/train-nfl.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-model-refresh
  cancel-in-progress: false
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source and reproducibility tests
        run: |
          npm run check
          npm test
      - name: Fit pregame NFL Elo with historical reference evaluation
        run: node scripts/train-nfl.mjs
      - name: Verify source provenance and evaluation sample sizes
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('data/nfl_elo.json','utf8'));
          if(m.source.project!=='nflverse/nflverse-data'||m.holdout.n<250||m.calibration.n<400||m.tuning.n<1000)throw Error('Source/evaluation gate failed');
          if(typeof m.readyForResearch!=='boolean'||Object.keys(m.ratings).length<30)throw Error('Invalid model artifact');
          console.log('Historical reference metrics:',JSON.stringify(m.holdout));
          NODE
      - name: Publish changed research artifact safely
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/nfl_elo.json)" ]]; then
            git config user.name 'betq-research-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add data/nfl_elo.json
            git commit -m 'data: refresh independent NFL Elo baseline from completed games'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'No completed result changes.'
          fi
