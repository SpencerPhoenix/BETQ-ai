name: NFL historical model research refresh
on:
  push:
    paths:
      - 'scripts/train-nfl.mjs'
      - 'src/nfl-elo.mjs'
      - '.github/workflows/train-nfl.yml'
  workflow_dispatch:
  schedule:
    # After overnight result updates; UTC, once daily.
    - cron: '17 11 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-model-refresh
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and reproducibility tests
        run: |
          npm run check
          npm test
      - name: Fit pregame NFL Elo with independent holdout
        run: node scripts/train-nfl.mjs
      - name: Verify no synthetic model artifact was used
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('data/nfl_elo.json','utf8'));
          if(m.source.project!=='nflverse/nfldata'||m.holdout.n<250||m.calibration.n<400||m.tuning.n<1000) {
            throw new Error('NFL research source / evaluation minimum not met');
          }
          if(typeof m.readyForResearch!=='boolean'||Object.keys(m.ratings).length<30) {
            throw new Error('Invalid NFL model artifact');
          }
          console.log('Research model validated:',m.readyForResearch);
          console.log('Holdout 2025:',JSON.stringify(m.holdout));
          NODE
      - name: Publish updated artifact, if completed games changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/nfl_elo.json)" ]]; then
            git config user.name "betq-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/nfl_elo.json
            git commit -m "data: refresh independent NFL Elo baseline from completed games"
            git push origin HEAD:main
          else
            echo "No completed NFL result changes. Nothing to publish."
          fi
